[project]
name = "hr-it-helpdesk-agent"
version = "0.1.0"
description = "White-label HR/IT helpdesk agent: RAG + MCP + guardrails"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-google-genai",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-mcp-adapters",
    "mcp",
    "psycopg[binary]",
    "pgvector",
    "fastembed",
    "pyyaml",
    "python-dotenv",
    "typer",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
